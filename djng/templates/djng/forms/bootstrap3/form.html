{% if errors %}<div class="djng-line-spreader">{{ errors }}</div>{% endif %}
{% for field, errors in fields %}
  <div{% with classes=field.css_classes %}{% if classes %} class="{{ classes }}"{% endif %}{% endwith %}>
    {{ field.label_tag }}{{ field }}
    {% if field.help_text %}<span class="help-block">{{ field.help_text|safe }}</span>{% endif %}
    {{ errors }}
  </div>
{% endfor %}
{% for field in hidden_fields %}{{ field }}{% endfor %}
