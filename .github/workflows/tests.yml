name: Django tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 / Django ${{ matrix.django }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        django: ['5.2.19']
        requirements: [tests/django52-requirements.txt]
    env:
      PYENV_ROOT: ${{ github.workspace }}/../.pyenv-ci
      PYENV_VERSION: '3.11.15'
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
            libsqlite3-dev libffi-dev liblzma-dev libncursesw5-dev xz-utils tk-dev

      - name: Install pyenv
        run: |
          git init "$PYENV_ROOT"
          git -C "$PYENV_ROOT" remote add origin https://github.com/pyenv/pyenv.git
          git -C "$PYENV_ROOT" fetch --depth 1 origin 06fd1ce78890d8f79a0795e0fdfbe9a53916b82e
          git -C "$PYENV_ROOT" checkout --detach FETCH_HEAD
          echo "$PYENV_ROOT/bin" >> "$GITHUB_PATH"
          echo "$PYENV_ROOT/shims" >> "$GITHUB_PATH"

      - name: Cache Python build
        uses: actions/cache@v4
        with:
          path: ${{ env.PYENV_ROOT }}/versions/3.11.15
          key: legacy-python-${{ runner.os }}-${{ runner.arch }}-ubuntu22-pyenv06fd1ce-3.11.15-v1

      - name: Build and verify Python 3.11
        run: |
          pyenv install --skip-existing "$PYENV_VERSION"
          pyenv rehash
          python --version
          python -c 'import bz2, ctypes, lzma, sqlite3, ssl; import sys; assert sys.version_info[:3] == (3, 11, 15)'

      - name: Install test dependencies
        env:
          DJANGO_VERSION: ${{ matrix.django }}
          TEST_REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install pip==24.3.1 setuptools==69.5.1 wheel==0.45.1
          python -m pip install -r "$TEST_REQUIREMENTS" "Django==$DJANGO_VERSION"
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          mkdir -p test-reports
          python -m pip freeze > test-reports/dependencies.txt

      - name: Check Python and Django modernization
        run: |
          git ls-files -z '*.py' | xargs -0 pyupgrade --py311-plus
          git ls-files -z '*.py' | xargs -0 django-upgrade --target-version 5.2

      - name: Run tests
        working-directory: tests
        run: |
          python manage.py makemigrations testshop --noinput
          python -m pytest --junitxml=../test-reports/junit.xml

      - name: Upload test results and dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: py311-django${{ matrix.django }}
          path: test-reports/
          if-no-files-found: ignore
