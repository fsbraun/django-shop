[tox]
envlist = py311-django52

[testenv]
changedir = tests
skip_install = true
commands = 
    python -m pip install --no-deps --no-build-isolation -e {toxinidir}
    python -m pip check
    python manage.py makemigrations testshop
    py.test {posargs}
deps =
    pip==24.3.1
    setuptools==69.5.1
    wheel==0.45.1
    -r{toxinidir}/tests/django52-requirements.txt
setenv =
    DJANGO_DEBUG = 1
